version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kosan-app
    container_name: kosan-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kosan-network

  webserver:
    image: nginx:alpine
    container_name: kosan-webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - kosan-network

networks:
  kosan-network:
    driver: bridge
